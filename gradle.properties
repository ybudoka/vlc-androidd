org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# This project predates AndroidX, it uses the bundled android-support-v4.jar.
android.useAndroidX=false
# The legacy sources reference the resources of the library projects through
# their own R class, which only works with a transitive R class.
android.nonTransitiveRClass=false
