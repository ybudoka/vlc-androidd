name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  # Kept in sync with build.gradle
  ANDROID_PLATFORM: android-33
  ANDROID_BUILD_TOOLS: 33.0.2

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-debug-apk
          path: vlc-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            vlc-android/build/reports/**
            java-libs/*/build/reports/**
          if-no-files-found: ignore
