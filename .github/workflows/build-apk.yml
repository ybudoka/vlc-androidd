name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  # Read from build.gradle / settings.gradle
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Write local.properties
        # The root build.gradle reads it unconditionally, and fails without it
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew --no-daemon --console=plain :application:app:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build the arm64-only APK
        # What a 64-bit-only device -- a Quest -- can actually load, without
        # the three other ABIs it will never run
        run: ./gradlew --no-daemon --console=plain -PabiFilter=arm64-v8a :application:app:assembleDebug

      - name: Upload the arm64-only APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-debug-apk-arm64
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            application/*/build/reports/**
            medialibrary/build/reports/**
          if-no-files-found: ignore
