// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.android_plugin_version = '8.13.2'
    ext.kotlin_version = '2.1.20'
    ext.kotlinx_version = '1.7.1'
    repositories {
        flatDir dirs: "gradle/plugins"
        google()
        mavenCentral()
        mavenLocal()
   }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.34.0'
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.1.20-1.0.32' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    tasks.withType(Javadoc) {
        // Ignores errors from mavenAndroidJavadocs task
        // (reference: github.com/novoda/bintray-release/issues/71#issuecomment-164324255)
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('encoding', 'UTF-8')
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_1_8.toString()
            freeCompilerArgs += ['-opt-in=kotlin.RequiresOptIn']
        }
    }
}

ext {
    appId = "org.videolan.vlc"
    versionCode = 3070100
    vlcMajorVersion = project.hasProperty('forceVlc4') && project.getProperty('forceVlc4') ? 4 : 3
    versionName = vlcMajorVersion == 3 ? '3.7.1' : '4.0.0-preview - ' + versionCode
    remoteAccessVersion = '0.17.0'
    libvlcVersion = vlcMajorVersion == 3 ? '3.7.1' :'4.0.0-eap25'

    def has_64_bits = false
    if (project.hasProperty('aarMediaLib')) {
        useLocalMediaLibrary = false
        abisSelected = []
    } else {
        def missing_libs = false
        abisSelected = project.findProperty('vlcLibABI') ? project.getProperty('vlcLibABI').split(',').collect{it as String} : (project.hasProperty('vlcLibVariant') ? project.getProperty('vlcLibVariant') : null)
        if (abisSelected == null) {
            // automagically select the ABI's where the prebuilt libraries are available
            def abis = []
            ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi_test ->
                def is_32_bits = abi_test == 'x86' || abi_test == 'armeabi-v7a'
                medialibAndroidAPI = (vlcMajorVersion == 3 && is_32_bits) ? 17 : 21
                if (file('libvlcjni/libvlc/jni/libs/' + abi_test + '/libvlc.so').exists() &&
                    file('medialibrary/prefix/android-' + medialibAndroidAPI + '-' + abi_test + '/lib/libmedialibrary.a').exists())
                    abis.addAll(abi_test)
                if (!is_32_bits)
                    has_64_bits = true
            }
            if (abis == []) {
                logger.error('No libvlc.so+libmedialibrary.a found for any ABI')
                missing_libs = true
            }
            else {
                abisSelected = abis
                logger.warn('found libvlc.so+libmedialibrary.a for ABIs ' + abisSelected)
            }
        } else {
            abisSelected.each { abi_test ->
                def is_32_bits = abi_test == 'x86' || abi_test == 'armeabi-v7a'
                medialibAndroidAPI = (vlcMajorVersion == 3 && is_32_bits) ? 17 : 21
                missing_lib = false
                if (!file('libvlcjni/libvlc/jni/libs/' + abi_test + '/libvlc.so').exists()) {
                    logger.error('missing ' + file('libvlcjni/libvlc/jni/libs/' + abi_test + '/libvlc.so').getAbsolutePath())
                    missing_lib = true
                }
                if (!file('medialibrary/prefix/android-' + medialibAndroidAPI + '-' + abi_test + '/lib/libmedialibrary.a').exists()){
                    logger.error('missing ' + file('medialibrary/prefix/android-' + medialibAndroidAPI + '-' + abi_test + '/lib/libmedialibrary.a').getAbsolutePath())
                    missing_lib = true
                }
                missing_libs |= missing_lib
                if (!is_32_bits && !missing_lib)
                    has_64_bits = true
            }
        }
        if (abisSelected != null && !missing_libs)
            useLocalMediaLibrary = true
        else {
            logger.error('missing local files using medialibrary AAR')
            useLocalMediaLibrary = false
        }
    }
    medialibraryAndroidAPI = (vlcMajorVersion == 3 && !has_64_bits) ? 17 : 21
    medialibraryVersion = '0.13.19' + (vlcMajorVersion == 3 ? '' : '-vlc4')
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    ndkVersion32VLC3 = '21.4.7075529' // vlc-debian-android-3.0 docker image
    ndkVersionVLC4 = '28.2.13676358'  // vlc-debian-android docker image
    // default ndkVersion in android_plugin_version in 8.13.0: 27.0.12077973
    // VLC 3 32-bits needs to stick to NDK21 which is the last one supporting Android API 17
    // VLC 3 64-bits needs a NDK27 or higher to use a libc++_shared.so that is 16k aligned
    // toolchainNdkVersion is ignored if android.ndkPath is set in local.properties
    toolchainNdkVersion = properties.getProperty('android.ndkFullVersion') ?: ((vlcMajorVersion == 3 && !has_64_bits) ? ndkVersion32VLC3 : ndkVersionVLC4)
    tooclchainNdkPath = properties.getProperty('android.ndkPath')
    targetSdkVersion = 36
    compileSdkVersion = 36 // Dockers: 3.0=36 / 4.0=36
    desugarLib = '2.0.4'
    androidxLegacyVersion = '1.0.0'
    androidxCoreVersion = '1.12.0'
    appCompatVersion = '1.6.1'
    lifecycleVersion = '2.5.1'
    androidxPreferencesVersion = '1.2.1'
    androidxActivityVersion = '1.8.2'
    androidxFragmentVersion = '1.6.2'
    androidxAnnotationVersion = '1.7.1'
    androidxRecyclerviewVersion = '1.3.2'
    androidxLeanbackVersion = '1.0.0'
    androidxMaterialVersion = '1.11.0'
    constraintLayoutVersion = '2.1.4'
    windowVersion = '1.1.0'
    mediaVersion = '1.6.0'
    carVersion = '1.7.0-beta03'
    jdbcVersion =  '3.36.0'
    viewPager2Version = "1.0.0"
    archVersion = '2.2.0'
    roomVersion = '2.6.1'
    pagingVersion = '3.2.1'
    junitVersion = '4.13.2'
    junitExtVersion = '1.1.5'
    mockito = '2.25.0'
    //Retrofit 2.7 drops Android 5 support
    retrofit = '2.7.1'
    moshi = '1.8.0'
    ktorVersion = '2.3.7'
    powerMock = '2.0.2'
    espressoVersion = '3.5.1'
    livedataTest = '1.2.0'
    robolectric = '4.3.1'
    mockk = '1.9.3'
    testRunner = '1.4.0'
    orchestrator = '1.4.2'
    testCore = '1.5.0'
    publishScriptPath = '../../buildsystem/publish.gradle'
//    versionCode scheme is T M NN RR AA
//    T: Target/Flavour (1 for Android, 2 for Chrome?)
//    M: Major version from 0 to 9
//    NN: Minor version from 00 to 99
//    RR: Micro/Revision version from 00 to 99
//    AA: ABI from 0 to 99
//    Starting from 13050420 the last digit represents the ABI and the variant (normal or NoTv)
//    Also, the values are sorted to allow the most pertinent version to be prioritized
//
//    Old values
//    0 is dev
//    1 was ARMv5        (deprecated)
//    2 was ARMv6-nofpu  (deprecated)
//    3 was ARMv6-fpu    (deprecated)
//    4 is ARMv7-A
//    5 is x86
//    6 is MIPS
//    7 is ARMv8
//    8 is x86_64
//    9 is MIPS64
//
//    New values
//    0 is dev
//    1 is ARMv7-A No TV
//    2 is ARMv8 No TV
//    3 is x86 No TV
//    4 is x86_64 No TV
//    5 is ARMv7-A
//    6 is ARMv8
//    7 is x86
//    8 is ARMv7-A
}
