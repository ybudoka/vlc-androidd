apply plugin: 'com.android.application'

android {
    namespace 'org.videolan.vlc'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        /*
         * Deliberately different from the upstream org.videolan.vlc, so that
         * this build can be installed next to an official VLC. Everything that
         * is addressed by package name at runtime uses getPackageName(), not a
         * hardcoded string, so the two installs never talk to each other.
         */
        applicationId 'org.videolan.vlc.dev'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    buildFeatures {
        aidl true
    }

    /* CompatErrorActivity posts its report with the Apache HTTP client, which
     * was moved out of the framework in API 23. */
    useLibrary 'org.apache.http.legacy'

    /* The legacy (ant) layout: everything lives at the root of vlc-android/ */
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            /*
             * libvlc and its plugins are built by the top level Makefile
             * (ndk-build). When they have been built, or dropped in
             * vlc-android/libs/<abi>/, they are packaged in the APK.
             */
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    /* This is a 2013 code base: lint has a lot to say, none of it fatal. */
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation project(':ActionBarSherlock')
    implementation project(':SlidingMenu')
    implementation project(':WheelView')
}

/*
 * The About screen reads those from the assets, the Makefile generates them
 * the same way. Keep them out of the source tree.
 */
tasks.register('generateBuildAssets') {
    def outputDir = file("${buildDir}/generated/legacyAssets")
    outputs.dir outputDir
    doLast {
        outputDir.mkdirs()
        new File(outputDir, 'builddate.txt').text =
                new java.text.SimpleDateFormat('yyyy-MM-dd').format(new Date())
        new File(outputDir, 'builder.txt').text = System.getenv('VLC_BUILDER') ?: 'gradle'
        def revision = 'unknown'
        try {
            def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
            process.waitFor()
            if (process.exitValue() == 0)
                revision = process.text.trim()
        } catch (Exception ignored) {
            // not a git checkout, keep the default
        }
        new File(outputDir, 'revision.txt').text = revision
    }
}

android.sourceSets.main.assets.srcDirs += "${buildDir}/generated/legacyAssets"

tasks.named('preBuild') {
    dependsOn 'generateBuildAssets'
}
