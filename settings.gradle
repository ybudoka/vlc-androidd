/*
 * Gradle build of the Java/resources part of VLC for Android.
 *
 * The historical build is driven by the top level Makefile (ndk-build + ant).
 * That toolchain is not available anymore on current machines, so this Gradle
 * build is provided next to it to be able to compile, lint and package the
 * application -- typically from the CI. It reuses the legacy directory layout
 * as is, no source file is moved.
 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'vlc-android'

include ':vlc-android'
include ':ActionBarSherlock'
include ':SlidingMenu'
include ':WheelView'

project(':ActionBarSherlock').projectDir = file('java-libs/ActionBarSherlock')
project(':SlidingMenu').projectDir = file('java-libs/SlidingMenu')
project(':WheelView').projectDir = file('java-libs/WheelView')
